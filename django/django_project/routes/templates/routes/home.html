{% extends 'routes/base.html' %}

{% block content %}
    <h2>Witaj w Edytorze Tras!</h2>

        <p>Aby korzystać z aplikacji, <a href="{% url 'login' %}">zaloguj się</a>.</p>
    {% else %}
        <p>Przejdź do <a href="{% url 'route_list' %}">listy tras</a> aby rozpocząć.</p>
    {% endif %}
{% endblock %}
