{% extends 'routes/base.html' %}

{% block content %}
    <h2>Dodaj punkt do trasy "{{ route.title }}"</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Dodaj</button>
    </form>
    <a href="{% url 'route_detail' pk=route.pk %}">Powrót do trasy</a>
{% endblock %}
